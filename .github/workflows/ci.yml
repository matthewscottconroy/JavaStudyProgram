name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Installers are released for all three platforms, so all three have to be tested.
    # Sandbox detection, path handling, the java/java.exe launcher fallback and the whole
    # coding-exercise pipeline are exactly the code that differs per OS, and it used to ship
    # to students on platforms no test ever ran on.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Linux gets the strongest containment available, so install it there: it is also the
      # only runner where the bubblewrap path itself gets exercised.
      - name: Install bubblewrap
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      # Linux sweeps the whole bank: the content gate compiles all 727 coding exercises and
      # runs their tests (starter must fail, solution must pass).
      - name: Test (full bank)
        if: matrix.os == 'ubuntu-latest'
        run: mvn -B test
      # Elsewhere everything runs except that sweep. Question content does not vary by OS;
      # the compile-and-run pipeline does, and the rest of the suite covers it.
      - name: Test
        if: matrix.os != 'ubuntu-latest'
        run: mvn -B test -DexcludedGroups=full-bank
      - name: Package
        run: mvn -B package -DskipTests
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: java-study-program-jar
          path: target/java-study-program-*.jar
