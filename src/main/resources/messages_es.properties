# Texto de la interfaz del Java Study Program, en español.
#
# Las claves de la izquierda nunca cambian; solo se traduce lo que está a la derecha del "=".
# Los marcadores como {0} los rellena el programa: consérvalos y respeta su significado.
# Cualquier clave que falte aquí se muestra en inglés, así que una traducción parcial funciona.

