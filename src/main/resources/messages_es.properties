banner.codingOn        = disponibles
banner.codingOff       = no disponibles: ejecuta el programa con un JDK completo (no un JRE) para compilar y probar programas reales
banner.sandboxBwrap    = bubblewrap (sistema de archivos aislado, /tmp privado, sin red)
