# User-facing text for the Java Study Program.
#
# To translate: copy this file to messages_<language>.properties (e.g. messages_es.properties),
# translate the values on the right of each "=", and run with that locale. Keys never change.
# Placeholders like {0} are filled in by the program; keep them, and keep their meaning.

# ── Banner ───────────────────────────────────────────────────────────────────
app.title              = Java Study Program
banner.questions       = Questions in bank: {0}
banner.ai              = AI help:
banner.sandbox         = Exercise sandbox:
banner.coding          = Coding exercises:
banner.codingOn        = enabled
banner.codingOff       = disabled - run with a full JDK (not a JRE) to compile and test real programs
banner.sandboxBwrap    = bubblewrap (isolated filesystem, private /tmp, no network)
banner.sandboxMac      = macOS sandbox-exec (no network, writes confined to the build dir)
banner.sandboxNoneWin  = basic (heap cap + timeout only - no sandbox backend exists for Windows yet)
banner.sandboxNone     = basic (heap cap + timeout only - install bubblewrap for stronger isolation)
banner.aiOff           = disabled (set {0}, or point data/llm.json at a local model)
banner.aiOn            = {0} via {1} (max {2} calls/session)

